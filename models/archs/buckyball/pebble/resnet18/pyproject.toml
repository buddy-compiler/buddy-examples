[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "pebble-resnet18"
version = "0.1.0"
requires-python = ">=3.12"
[tool.setuptools]
packages = ["examples.models.pebble.resnet18", "examples.models.pebble.resnet18.permute", "examples.models.pebble.resnet18.quant"]
package-dir = {"examples.models.pebble.resnet18" = "."}
