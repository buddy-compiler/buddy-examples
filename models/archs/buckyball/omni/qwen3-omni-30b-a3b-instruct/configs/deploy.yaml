async_chunk: false
connectors:
  memory:
    name: SharedMemoryConnector
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_model_len: 256
    max_num_batched_tokens: 256
    dtype: float32
    enforce_eager: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    skip_mm_profiling: true
    load_format: bemu_omni
    gpu_memory_utilization: 0.1
    hf_overrides:
      architectures: [examples.models.omni.qwen3-omni-30b-a3b-instruct.omni_model]
    mm_processor_kwargs:
      min_pixels: 1024
      max_pixels: 65536
    default_sampling_params:
      temperature: 0.0
      max_tokens: 32
  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    max_model_len: 256
    max_num_batched_tokens: 256
    dtype: float32
    enforce_eager: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    skip_mm_profiling: true
    load_format: bemu_omni
    gpu_memory_utilization: 0.1
    hf_overrides:
      architectures: [examples.models.omni.qwen3-omni-30b-a3b-instruct.omni_model]
    input_connectors:
      from_stage_0: memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 128
      stop_token_ids: [2150]
  - stage_id: 2
    devices: "0"
    max_num_seqs: 1
    max_model_len: 2048
    max_num_batched_tokens: 2048
    dtype: float32
    enforce_eager: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    skip_mm_profiling: true
    load_format: bemu_omni
    gpu_memory_utilization: 0.1
    hf_overrides:
      architectures: [examples.models.omni.qwen3-omni-30b-a3b-instruct.omni_model]
    input_connectors:
      from_stage_1: memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
