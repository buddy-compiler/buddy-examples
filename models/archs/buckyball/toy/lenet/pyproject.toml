[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "toy-lenet"
version = "0.1.0"
requires-python = ">=3.12"
[tool.setuptools]
packages = ["examples.models.toy.lenet", "examples.models.toy.lenet.permute", "examples.models.toy.lenet.quant"]
package-dir = {"examples.models.toy.lenet" = "."}
